<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src http://127.0.0.1:* http://localhost:*">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pluffy Studio</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="petal" d="M0 -2 C -7 -8, -5 -15, 0 -15 C 5 -15, 7 -8, 0 -2 Z"/>
    <symbol id="sakura" viewBox="-16 -16 32 32">
      <g fill="#ff8fb0"><use href="#petal"/><use href="#petal" transform="rotate(72)"/><use href="#petal" transform="rotate(144)"/><use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(288)"/></g>
      <circle r="2.6" fill="#fff3c4"/>
    </symbol>
  </defs>
</svg>

<div id="boot" class="boot">
  <svg class="boot-logo"><use href="#sakura"/></svg>
  <div class="boot-title">Pluffy Studio</div>
  <div class="boot-msg" id="bootMsg">Getting things ready ...</div>
</div>

<header class="topbar">
  <div class="brand"><svg><use href="#sakura"/></svg><b>Pluffy</b><span>Studio</span></div>
  <label class="search"><span>&#x2315;</span><input id="search" placeholder="Search commands   (Ctrl+K)" autocomplete="off" spellcheck="false"></label>
  <div class="actions">
    <button class="pill" id="btnCode" title="Open the Pluffy folder in VS Code">&#x1F4DD; VS Code</button>
    <button class="pill" id="btnCmd" title="Open a CMD / terminal window in the Pluffy folder">&#x2328; CMD</button>
    <button class="pill primary" id="btnChat" title="Open the Pluffy chat">&#x1F4AC; Chat</button>
  </div>
</header>

<aside class="sidebar">
  <nav id="nav">
    <button data-view="home" class="active"><i>&#x1F338;</i>Home</button>
    <button data-view="editor"><i>&#x1F4DD;</i>Editor</button>
    <button data-view="extensions"><i>&#x1F9E9;</i>Extensions</button>
    <button data-view="engine"><i>&#x2699;&#xFE0F;</i>Engine</button>
  </nav>
  <div class="side-foot">
    <div class="tag">The CLI is still the engine.<br>This app is the skin.</div>
  </div>
</aside>

<main class="main">
  <div class="views">
    <section id="view-home" class="view"></section>

    <section id="view-editor" class="view hidden full">
      <div id="editorState" class="center-card"></div>
      <iframe id="editorFrame" class="hidden" allow="clipboard-read; clipboard-write"></iframe>
    </section>

    <section id="view-extensions" class="view hidden"></section>
    <section id="view-engine" class="view hidden"></section>
  </div>

  <div id="dockResize" class="dock-resize" title="Drag to resize"></div>
  <section id="dock" class="dock">
    <div class="dock-head">
      <div id="termTabs" class="term-tabs"></div>
      <div class="dock-tools">
        <button id="termNew" title="New terminal">+</button>
        <button id="termToggle" title="Hide / show terminal">&#x25BE;</button>
      </div>
    </div>
    <div id="termBody" class="term-body"></div>
  </section>
</main>

<div id="modal" class="modal hidden"></div>
<div id="toasts" class="toasts"></div>

<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
