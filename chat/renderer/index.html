<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pluffy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-top drag">
        <button id="newChat" class="icon-btn nodrag" title="New chat (Ctrl+N)" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
      <div class="search"><input id="search" type="search" placeholder="Search" aria-label="Search chats" spellcheck="false"></div>
      <ul id="sessions" class="sessions"></ul>
      <div class="side-bottom">
        <button id="openSettings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head drag">
        <div class="head-center">
          <div class="avatar" aria-hidden="true">P</div>
          <div class="head-name">Pluffy</div>
          <button id="status" class="status nodrag" title="Model server status. Click to open settings."><span class="dot"></span><span id="statusText">Checking</span></button>
        </div>
      </header>

      <div id="scroll" class="scroll"><div id="thread" class="thread"></div></div>

      <div id="quick" class="quick" aria-label="Quick commands"></div>

      <footer class="composer">
        <div id="suggest" class="suggest hidden" role="listbox"></div>
        <div class="modelbar"><label for="modelSelect">Model</label><select id="modelSelect" aria-label="Model"></select></div>
        <div class="field">
          <textarea id="input" rows="1" placeholder="Message Pluffy" aria-label="Message" spellcheck="true"></textarea>
          <button id="send" class="send" aria-label="Send" title="Send">
            <svg class="i-send" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <div id="sheet" class="backdrop hidden">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Models</h2>
      <p id="sheetHint" class="hint"></p>
      <label for="setProfile">Which model are you editing?</label>
      <select id="setProfile">
        <option value="pluffy">Pluffy (Colab)</option>
        <option value="api">API model</option>
      </select>
      <label for="setServer">Server URL</label>
      <input id="setServer" type="text" spellcheck="false" placeholder="https://something.trycloudflare.com">
      <label for="setModel">Model name</label>
      <input id="setModel" type="text" spellcheck="false" placeholder="pluffy-v11">
      <label for="setKey">API key (optional)</label>
      <input id="setKey" type="password" spellcheck="false" placeholder="Leave empty for Ollama">
      <div id="sheetMsg" class="sheet-msg" aria-live="polite"></div>
      <div class="sheet-actions">
        <button id="sheetTest" class="btn">Test connection</button>
        <span class="grow"></span>
        <button id="sheetCancel" class="btn">Cancel</button>
        <button id="sheetSave" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <div id="menu" class="ctx hidden" role="menu"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
